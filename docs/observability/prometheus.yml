global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: relayapi
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['relayapi:3000']
    # Enable when RELAY_METRICS_TOKEN is configured. File contains only the token.
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/relay-metrics-token
