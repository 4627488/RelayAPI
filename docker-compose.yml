services:
  relayapi:
    image: ghcr.io/4627488/relayapi:latest
    build: .
    restart: unless-stopped
    mem_limit: ${RELAY_MEMORY_LIMIT:-768m}
    mem_reservation: ${RELAY_MEMORY_RESERVATION:-512m}
    env_file: .env
    environment:
      GOMEMLIMIT: ${RELAY_GOMEMLIMIT:-576MiB}
      GOGC: "50"
      GODEBUG: madvdontneed=1
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [relay]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: relay
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [relay]

volumes:
  relay-postgres:
networks:
  relay:
