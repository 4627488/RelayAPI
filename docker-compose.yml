services:
  relayapi:
    image: ghcr.io/4627488/relayapi:latest
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [relay]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: relay
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [relay]

  # CLIProxyAPI is intentionally not exposed publicly. Supply its config and
  # credentials under ./cliproxyapi before enabling this service.
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    restart: unless-stopped
    volumes:
      # Writable so the authenticated Relay admin panel can persist CPA's
      # complete configuration through /v0/management/config.yaml.
      - ./cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml
      - ./cliproxyapi/auths:/root/.cli-proxy-api
    networks: [relay]

volumes:
  relay-postgres:
networks:
  relay:
