services:
  relayapi:
    image: ghcr.io/4627488/relayapi:latest
    build: .
    restart: unless-stopped
    mem_limit: ${RELAY_MEMORY_LIMIT:-768m}
    mem_reservation: ${RELAY_MEMORY_RESERVATION:-384m}
    env_file: .env
    environment:
      GOMEMLIMIT: ${RELAY_GOMEMLIMIT:-448MiB}
      GOGC: "50"
      GODEBUG: madvdontneed=1
    ports:
      - "${RELAY_BIND_ADDRESS:-0.0.0.0}:${RELAY_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [relay]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    shm_size: ${POSTGRES_SHM_SIZE:-64m}
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: relay
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-50}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-96MB}"]
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [relay]

volumes:
  relay-postgres:
    name: ${POSTGRES_VOLUME_NAME:-relayapi-postgres}
networks:
  relay:
