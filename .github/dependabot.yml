version: 2
updates:
  # Security fixes run when alerts are raised; scheduled version PRs are off.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /third_party/cpaexecutor
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      executor-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
