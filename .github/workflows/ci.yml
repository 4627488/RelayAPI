name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "rewrite/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: relay_test
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://relay_test:relay_test@127.0.0.1:5432/relay_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "These files need gofmt:" >&2
            echo "$files" >&2
            echo >&2
            gofmt -d ./cmd ./internal >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Verify and test embedded CPA bridge
        working-directory: third_party/cpaexecutor
        run: |
          go mod verify
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/relayapi ./cmd/rai

      - name: Set up Node.js for Cursor SDK
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test real Codex interoperability
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex-interop" --no-audit --no-fund @openai/codex@0.163.0
          export CODEX_INTEROP_BINARY="$RUNNER_TEMP/codex-interop/node_modules/.bin/codex"
          "$CODEX_INTEROP_BINARY" --version
          go test -count=1 -v ./internal/rai ./internal/app -run '^TestCodexClient'
          cd third_party/cpaexecutor
          go test -count=1 -v -run '^TestCodexClient' ./...

      - name: Build and smoke test managed Cursor SDK
        run: |
          node scripts/setup-cursor-runtime.mjs
          export RELAY_CURSOR_RUNTIME_DIR="$PWD/.cache/cursor-runtime"
          export RELAY_CURSOR_SMOKE=1
          cd third_party/cpaexecutor
          go test -race -count=1 -run TestCursorBundledRuntimeStarts ./...

  rai-windows:
    name: RAI Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test launcher and running executable replacement
        run: go test -count=1 ./internal/rai ./cmd/rai

  frontend:
    name: Web frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test UI and accessibility
        run: pnpm test

      - name: Build
        run: pnpm build

  agent-clients:
    name: Real rai agent clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install pinned official agent clients
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rai-clients" --no-audit --no-fund \
            @earendil-works/pi-coding-agent@1.4.0 opencode-ai@1.19.4 \
            @xai-official/grok@1.0.70 @anthropic-ai/claude-code@2.1.114
          node "$RUNNER_TEMP/rai-clients/node_modules/opencode-ai/postinstall.mjs"
          curl -fsSL --retry 3 https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v0.10.1/prime-agent-0.10.1-linux-x64.tar.gz -o "$RUNNER_TEMP/prime-agent.tar.gz"
          echo "21ec219183f4134dd23dce9572102e69456066fe374846525561c776d4d1945c  $RUNNER_TEMP/prime-agent.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/prime-agent"
          tar -xzf "$RUNNER_TEMP/prime-agent.tar.gz" -C "$RUNNER_TEMP/prime-agent"
          python -m pip install uv==0.13.5
          git init "$RUNNER_TEMP/hermes-source"
          git -C "$RUNNER_TEMP/hermes-source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-source" fetch --depth 1 origin d05095663342556788cf2a198bfa7844cc7968ab
          git -C "$RUNNER_TEMP/hermes-source" checkout --detach FETCH_HEAD
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-venv" uv sync --project "$RUNNER_TEMP/hermes-source" --frozen --no-dev
      - name: Verify routing and real tool round trips
        shell: bash
        run: |
          set -euo pipefail
          export RAI_PI_INTEROP_BINARY="$RUNNER_TEMP/rai-clients/node_modules/.bin/pi"
          export RAI_OPENCODE_INTEROP_BINARY="$RUNNER_TEMP/rai-clients/node_modules/.bin/opencode"
          export RAI_GROK_INTEROP_BINARY="$RUNNER_TEMP/rai-clients/node_modules/.bin/grok"
          export RAI_CLAUDE_INTEROP_BINARY="$RUNNER_TEMP/rai-clients/node_modules/.bin/claude"
          export RAI_PRIME_AGENT_INTEROP_BINARY="$RUNNER_TEMP/prime-agent/prime-agent"
          export RAI_HERMES_INTEROP_BINARY="$RUNNER_TEMP/hermes-venv/bin/hermes"
          for agent in "$RAI_PI_INTEROP_BINARY" "$RAI_OPENCODE_INTEROP_BINARY" "$RAI_GROK_INTEROP_BINARY" "$RAI_CLAUDE_INTEROP_BINARY" "$RAI_PRIME_AGENT_INTEROP_BINARY" "$RAI_HERMES_INTEROP_BINARY"; do
            "$agent" --version
          done
          go test -count=1 -v ./internal/rai -run '^TestAgentClient(UsesGateway|ToolRoundTrip|ConfiguredUsesGateway|ConfiguredToolRoundTrip)$'

  images:
    name: Build RelayAPI image
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=relayapi
          cache-to: type=gha,mode=max,scope=relayapi
