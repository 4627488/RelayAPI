name: Deploy CPA plugins to production

on:
  workflow_run:
    workflows:
      - Publish CPA bridge image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag (sha-xxxxxxx or version)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  # RelayAPI and CPA share one Docker daemon and one deployment directory.
  # Serializing both workflows avoids concurrent pulls/extracts corrupting a
  # containerd snapshot and makes the server-side flock an additional guard.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Resolve immutable image
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag=$MANUAL_TAG
          else
            tag="sha-${PUBLISHED_SHA:0:7}"
          fi
          if [[ ! "$tag" =~ ^(sha-[0-9a-f]{7,40}|v?[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "image=ghcr.io/${{ github.repository_owner }}/relayapi-cpa-plugin:$tag" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install plugins and restart CPA
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE'" <<'REMOTE'
          set -Eeuo pipefail

          target_image=$1
          deploy_dir=${RELAYAPI_DEPLOY_DIR:-/opt/relayapi}
          compose_file=${RELAYAPI_COMPOSE_FILE:-compose.yml}

          if [[ ! "$target_image" =~ ^ghcr\.io/4627488/relayapi-cpa-plugin:(sha-[0-9a-f]{7,40}|v?[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Refusing invalid CPA plugin image: $target_image" >&2
            exit 2
          fi

          cd "$deploy_dir"
          exec 9>./.deploy.lock
          flock -n 9 || { echo "Another RelayAPI deployment is running" >&2; exit 3; }

          old_image=$(awk '/^  cpa-plugin:/{service=1; next} service && /^    image:/{print $2; exit} service && /^  [^ ]/{exit}' "$compose_file")
          if [[ -z "$old_image" ]]; then
            echo "Cannot determine the currently configured CPA plugin image" >&2
            exit 4
          fi

          set_compose_image() {
            local image=$1
            sed -i -E "/^  cpa-plugin:/,/^  [^ ]/ s#^    image: .*\$#    image: ${image}#" "$compose_file"
            docker compose -f "$compose_file" config --quiet
          }

          install_and_restart() {
            local image=$1
            local require_control_plane=${2:-false}
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image" || return 1
            set_compose_image "$image" || return 1
            docker compose -f "$compose_file" run --rm cpa-plugin || return 1

            plugin_volume=$(docker inspect relayapi-cliproxyapi-1 --format '{{range .Mounts}}{{if eq .Destination "/CLIProxyAPI/plugins"}}{{.Name}}{{end}}{{end}}') || return 1
            if [[ -z "$plugin_volume" ]]; then
              echo "Cannot determine the CPA plugin volume" >&2
              return 1
            fi
            expected=$(docker run --rm --entrypoint sha256sum "$image" /relayapi-bridge.so | awk '{print $1}') || return 1
            installed=$(docker run --rm -v "$plugin_volume:/plugins:ro" --entrypoint sha256sum "$image" /plugins/relayapi-bridge.so | awk '{print $1}') || return 1
            if [[ -z "$expected" || "$installed" != "$expected" ]]; then
              echo "Installed CPA bridge checksum does not match $image" >&2
              return 1
            fi

            docker compose -f "$compose_file" up -d --no-deps --force-recreate cliproxyapi || return 1

            management_key=$(docker inspect relayapi-relayapi-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^CPA_MANAGEMENT_KEY=//p' | head -1)
            cpa_ip=$(docker inspect relayapi-cliproxyapi-1 --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}') || return 1
            if [[ -z "$management_key" || -z "$cpa_ip" ]]; then
              echo "Cannot probe the CPA management API" >&2
              return 1
            fi
            for _ in $(seq 1 30); do
              payload=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $management_key" \
                "http://$cpa_ip:8317/v0/management/plugins/relayapi-bridge/health" 2>/dev/null || true)
              if grep -q '"status":"ok"' <<<"$payload" &&
                 { [[ "$require_control_plane" != true ]] ||
                   { grep -q '"mode":"control-plane-only"' <<<"$payload" &&
                     grep -q '"data_plane_interceptors":false' <<<"$payload"; }; }; then
                docker compose -f "$compose_file" ps cliproxyapi || return 1
                return 0
              fi
              sleep 2
            done
            echo "CPA bridge did not become ready in control-plane-only mode" >&2
            return 1
          }

          backup="${compose_file}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$compose_file" "$backup"

          if ! install_and_restart "$target_image" true; then
            echo "CPA plugin deployment failed; rolling back to $old_image" >&2
            cp -a "$backup" "$compose_file"
            if ! install_and_restart "$old_image" false; then
              echo "CPA plugin rollback failed" >&2
              exit 5
            fi
            echo "CPA plugin rollback completed" >&2
            exit 1
          fi

          echo "CPA plugins deployed: $old_image -> $target_image"
          REMOTE
