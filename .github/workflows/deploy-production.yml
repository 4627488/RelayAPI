name: Deploy production

on:
  workflow_run:
    workflows:
      - Publish RelayAPI image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag (sha-xxxxxxx or version)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Resolve immutable image
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag=$MANUAL_TAG
          else
            tag="sha-${PUBLISHED_SHA:0:7}"
          fi
          if [[ ! "$tag" =~ ^(sha-[0-9a-f]{7,40}|v?[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          echo "image=ghcr.io/${{ github.repository_owner }}/relayapi:$tag" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with health check and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=40 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/relayapi/deploy-relayapi.sh '$IMAGE'"; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            echo "Another deployment is still running; retrying in 30 seconds ($attempt/40)"
            sleep 30
          done
          echo "Timed out waiting for the production deployment lock" >&2
          exit 3
