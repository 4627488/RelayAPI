name: Deploy preview

on:
  workflow_run:
    workflows:
      - Publish RelayAPI image
      - Publish CPA bridge image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy RelayAPI preview
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PUBLISHED_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          component=all
          if [ "$PUBLISHED_WORKFLOW" = "Publish RelayAPI image" ]; then
            component=relay
          elif [ "$PUBLISHED_WORKFLOW" = "Publish CPA bridge image" ]; then
            component=bridge
          fi
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$component'" <<'REMOTE'
          set -euo pipefail
          cd /opt/relayapi-preview
          component=$1
          if [ "$component" = relay ] || [ "$component" = all ]; then
            docker compose -f compose.yml pull relayapi
            docker compose -f compose.yml up -d --no-deps --force-recreate relayapi
          fi
          if [ "$component" = bridge ] || [ "$component" = all ]; then
            docker compose -f compose.yml pull cpa-plugin
            docker compose -f compose.yml up --no-deps --force-recreate cpa-plugin
            docker compose -f compose.yml up -d --no-deps --force-recreate cliproxyapi
          fi
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              echo
              docker compose -f compose.yml ps relayapi
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yml logs --tail=100 relayapi
          exit 1
          REMOTE
