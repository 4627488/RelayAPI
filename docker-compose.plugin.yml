services:
  cpa-plugin:
    image: ghcr.io/4627488/relayapi-cpa-plugin:latest
    build: ./cliproxyapi-plugin
    restart: "no"
    profiles: ["plugin-install"]
    volumes:
      - relay-cpa-plugins:/plugins

  cliproxyapi:
    environment:
      GOMEMLIMIT: 300MiB
      GOGC: "75"
      GODEBUG: madvdontneed=1
    volumes:
      - relay-cpa-plugins:/CLIProxyAPI/plugins:ro

volumes:
  relay-cpa-plugins:
